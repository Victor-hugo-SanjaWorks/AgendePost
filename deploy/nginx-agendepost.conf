# Include in nginx's http {} context (sites-available or conf.d, as appropriate).
# Requires an existing operator-obtained TLS certificate and nginx >= 1.19.4.
# No CDN/additional proxy is included in this single-host trust boundary.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name agendepost.com.br;
    access_log off;
    return 308 https://agendepost.com.br$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agendepost.com.br;
    # Operator obtains and renews the certificate; these are reviewed placeholders.
    ssl_certificate /etc/letsencrypt/live/agendepost.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agendepost.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Query strings may contain OAuth codes or invitation tokens. Do not use the
    # default combined access log. Review error-log privacy/retention separately.
    access_log off;
    error_log /var/log/nginx/agendepost-error.log crit;
    client_max_body_size 6m;
    client_body_timeout 30s;
    send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host agendepost.com.br;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        # OVERWRITE, never append $proxy_add_x_forwarded_for or trust client input.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }
}
